<template>
    <div if:true={showWarning} class="slds-m-around_medium">
        <!-- SLDS Warning Banner -->
        <div class="slds-notify slds-notify_alert slds-theme_warning slds-alert_warning" role="alert" style="border-radius: 8px; border-left: 5px solid #ff9e2c; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
            <span class="slds-assistive-text">Warning</span>
            
            <!-- Warning Icon -->
            <lightning-icon icon-name="utility:warning" size="small" variant="warning" class="slds-m-right_x-small"></lightning-icon>
            
            <!-- Message Content -->
            <div class="slds-media__body">
                <!-- <h2 class="slds-text-heading_small slds-m-bottom_x-small" style="font-weight: bold;">
                    Insurance Eligibility Warning
                </h2> -->
                <p class="slds-text-body_regular">
                    {warningMessage}
                </p>
            </div>
        </div>
    </div>
</template>
